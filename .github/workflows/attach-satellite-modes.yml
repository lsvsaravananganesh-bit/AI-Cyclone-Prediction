name: Attach STRIDE Satellite AI modes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach satellite modes script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/stride-satellite-modes.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s = s.replace('</body>', tag + '\n</body>', 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add STRIDE Satellite AI mode selector'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/attach-satellite-modes.yml
          git commit -m 'Remove one-time satellite mode workflow'
          git push
