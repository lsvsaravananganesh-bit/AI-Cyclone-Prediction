name: Integrate Three-Stage UI

on:
  push:
    branches: [main]
    paths:
      - 'assets/three-stage-ui.js'
      - '.github/workflows/integrate-three-stage-ui.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Three-Stage UI into main analysis page
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/three-stage-ui.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html does not contain </body>')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/three-stage-ui.js
          git diff --cached --quiet || git commit -m 'Show identification classification and prediction on main analysis page'
          git push
