name: Wire Zoom Earth map

on:
  push:
    paths:
      - '.github/workflows/attach-zoom-earth-map.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject map script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/zoom-earth-map.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit map integration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/attach-zoom-earth-map.yml
          git add index.html assets/zoom-earth-map.js .github/workflows/attach-zoom-earth-map.yml
          git diff --cached --quiet || git commit -m 'Replace SCORPIO map with Zoom Earth storm tracker'
          git push
